[project]
name = "grove-tests"
version = "0.0.0"
requires-python = "==3.13.*"

[dependency-groups]
dev = [
    "libtmux==0.62.0",
    "pytest<9.1",
    "pytest-bdd==8.1.0",
    "pytest-xdist==3.8.0",
    "rich==14.1.0",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
